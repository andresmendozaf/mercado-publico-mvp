# Base de datos H2 para tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Las migraciones de Flyway usan sintaxis específica de PostgreSQL; los tests
# siguen generando el esquema en H2 vía ddl-auto=create-drop como hasta ahora.
spring.flyway.enabled=false

# Propiedad necesaria para LicitacionService
mercadopublico.api.ticket=test-ticket