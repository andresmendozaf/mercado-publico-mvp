spring.application.name=mvp

# Conexión a Base de Datos Dinámica
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:mercadopublico_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway: adopta el esquema existente (creado por Hibernate) sin recrearlo.
# baseline-version=1 coincide con V1 (baseline de licitaciones); en una BD ya
# poblada, V1 se marca como aplicada sin ejecutarse y solo corren migraciones
# posteriores (V2 en adelante).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# API Key / Ticket Mercado Público
mercadopublico.api.ticket=${MERCADOPUBLICO_TICKET}
mercadopublico.api.base-url=https://api.mercadopublico.cl/servicios/v1/publico

app.cors.allowed-origins=http://localhost:5173,http://localhost:4200,http://localhost:3000

