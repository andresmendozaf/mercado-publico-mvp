services:
  # ----------------------------------------------------
  # Servicio 1: Base de Datos PostgreSQL 16
  # ----------------------------------------------------
  mvp_postgres_db:
    image: postgres:16-alpine
    container_name: mvp_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mercadopublico_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_mvp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-mercadopublico_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mvp_network

  # ----------------------------------------------------
  # Servicio 2: Backend Spring Boot (Java 21)
  # ----------------------------------------------------
  mvp_backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mvp-backend:v1
    container_name: mvp_backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mvp_postgres_db
      DB_NAME: ${DB_NAME:-mercadopublico_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      MERCADOPUBLICO_TICKET: ${MERCADOPUBLICO_TICKET}
    depends_on:
      mvp_postgres_db:
        condition: service_healthy
    networks:
      - mvp_network

# ----------------------------------------------------
# Volúmenes y Redes Persistentes
# ----------------------------------------------------
volumes:
  postgres_mvp_data:

networks:
  mvp_network:
    driver: bridge